$activeBorderColor = rgb(d7790b)

general {
    layout = dwindle
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = $activeBorderColor
    col.inactive_border = rgba(d7790b20)
}

group {
    col.border_active = $activeBorderColor
}

decoration {
    rounding = 14
	  dim_special = 0.0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(22222280)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
		    contrast = 0.85
		    brightness = 0.7
		    noise = 0.15
		    vibrancy = 1.0
		    vibrancy_darkness = 0.1
		    special = true
    }
}
