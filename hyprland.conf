$activeBorderColor = rgb(d7790b)

general {
    layout = dwindle
    gaps_in = 12
    gaps_out = 24
    border_size = 2
    col.active_border = $activeBorderColor
    col.inactive_border = rgba(d7790b20)
}

group {
    col.border_active = $activeBorderColor
}

decoration {
    rounding = 20
	  dim_special = 0.0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        # range = 2
        # render_power = 3
        # color = rgba(1a1a1aee)

        #vdawg
        range = 12
        render_power = 3
        color = rgba(22222280)
    }

    blur {
        enabled = true
        size = 4
        passes = 3
        new_optimizations = true
        xray = false
		    contrast = 0.85
		    brightness = 0.8
		    noise = 0.15
		    vibrancy = 1.0
		    vibrancy_darkness = 0.1
		    special = true
        # ignore_opacity = true
        # popups_ignorealpha = 0.5
        # input_methods_ignorealpha = 0.5
    }
}

animations {
    enabled = yes
    bezier = wind, 0.02, 0.9, 0.1, 1.03
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = fade, 1, 10, default
    animation = workspaces, 1, 1, wind
}
